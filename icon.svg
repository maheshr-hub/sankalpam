<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C1C13"/>
      <stop offset="100%" stop-color="#5C1010"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D372"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#C9A227" stroke-width="4" opacity="0.55"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#E8A33D" stroke-width="2" opacity="0.45"/>

  <!-- Lotus petals -->
  <g fill="url(#gold)" opacity="0.9">
    <g id="petals">
      <path d="M256 78 C238 122 238 152 256 178 C274 152 274 122 256 78 Z"/>
    </g>
    <use href="#petals" transform="rotate(45 256 256)"/>
    <use href="#petals" transform="rotate(90 256 256)"/>
    <use href="#petals" transform="rotate(135 256 256)"/>
    <use href="#petals" transform="rotate(180 256 256)"/>
    <use href="#petals" transform="rotate(225 256 256)"/>
    <use href="#petals" transform="rotate(270 256 256)"/>
    <use href="#petals" transform="rotate(315 256 256)"/>
  </g>

  <!-- Sun disc -->
  <circle cx="256" cy="256" r="118" fill="#E8A33D"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#F5D372" stroke-width="6"/>

  <!-- Om -->
  <text x="256" y="316" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, serif"
        font-size="176" fill="#5C1010">ॐ</text>
</svg>
